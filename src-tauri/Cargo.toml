[package]
name = "appasciidoc"
version = "0.1.0"
description = "Editor leve de AsciiDoc com edicao inline e workspace de notas"
authors = ["AppAsciiDoc"]
edition = "2021"
rust-version = "1.77"

# A lib e compartilhada entre o binario desktop e o entrypoint mobile.
[lib]
name = "appasciidoc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
walkdir = "2.5.0"
notify = "8.2.0"
lopdf = { version = "0.36", default-features = false }
git2 = { version = "0.19", default-features = false, features = ["vendored-libgit2", "vendored-openssl", "https"] }
age = "0.11.1"
zeroize = "1"
scrypt = "0.11"
rand = "0.8"
subtle = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Threading"] }

[target."cfg(target_os = \"linux\")".dependencies]
gtk = "0.18"
webkit2gtk = "2"
